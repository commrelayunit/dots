<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- SPDX-License-Identifier: GPL-3.0-or-later
     Kessel: JetBrainsMono Nerd Font as the default monospace and UI (sans) family,
     so Qt and other fontconfig users pick it up without qt5ct/qt6ct.
     Noto Color Emoji is the fallback for emoji (JetBrains Mono has none). -->
<fontconfig>
  <alias binding="strong"><family>monospace</family><prefer><family>JetBrainsMono Nerd Font</family><family>Noto Color Emoji</family></prefer></alias>
  <alias binding="strong"><family>sans-serif</family><prefer><family>JetBrainsMono Nerd Font</family><family>Noto Color Emoji</family></prefer></alias>
  <alias binding="strong"><family>serif</family><prefer><family>JetBrainsMono Nerd Font</family><family>Noto Color Emoji</family></prefer></alias>
  <alias binding="strong"><family>emoji</family><prefer><family>Noto Color Emoji</family></prefer></alias>
  <!-- apps that ask for JetBrains Mono explicitly still get colour emoji -->
  <alias><family>JetBrainsMono Nerd Font</family><prefer><family>JetBrainsMono Nerd Font</family><family>Noto Color Emoji</family></prefer></alias>
</fontconfig>
