<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- SPDX-License-Identifier: GPL-3.0-or-later
     Kessel: JetBrainsMono Nerd Font as the default monospace and UI (sans) family,
     so Qt and other fontconfig users pick it up without qt5ct/qt6ct. -->
<fontconfig>
  <alias binding="strong"><family>monospace</family><prefer><family>JetBrainsMono Nerd Font</family></prefer></alias>
  <alias binding="strong"><family>sans-serif</family><prefer><family>JetBrainsMono Nerd Font</family></prefer></alias>
</fontconfig>
