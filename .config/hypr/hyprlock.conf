# hyprlock — Kessel palette, JetBrainsMono Nerd Font.

$font   = JetBrainsMono Nerd Font
$text   = rgb(d8dae1)
$accent = rgb(8aadf4)
$base   = rgba(000000cc)

general {
    hide_cursor = true
    ignore_empty_input = true
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 6
    brightness = 0.6
}

label {
    monitor =
    text = $TIME
    font_family = $font
    font_size = 72
    color = $text
    position = 0, 160
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    font_family = $font
    font_size = 16
    color = $text
    position = 0, 80
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 52
    outline_thickness = 2
    rounding = 14
    outer_color = $accent
    inner_color = $base
    font_color = $text
    font_family = $font
    check_color = rgb(a6da95)
    fail_color = rgb(e06c75)
    placeholder_text = <i>  password</i>
    fail_text = <i>$FAIL ($ATTEMPTS)</i>
    fade_on_empty = false
    dots_center = true
    position = 0, -40
    halign = center
    valign = center
}
