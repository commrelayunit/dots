# hypridle — only started when ENABLE_IDLE = true in exec.lua (after lock is verified).
# No backlight/suspend listeners (not every machine has them). Timeouts are generous.

general {
    lock_cmd         = ~/.config/hypr/scripts/lock.sh   # Quickshell lock, hyprlock fallback
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd  = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
}

listener {
    timeout    = 900                         # 15 min → lock
    on-timeout = loginctl lock-session
}

listener {
    timeout    = 960                         # 16 min → screen off
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({action = "off"})'
    on-resume  = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
}
