# Fuzzel — the only launcher. Quickshell-independent (SUPER+R).
[main]
font=JetBrainsMono Nerd Font:size=11
terminal=kitty -e
prompt="  "
layer=overlay
width=40
lines=12
horizontal-pad=20
vertical-pad=14
inner-pad=8
icons-enabled=yes
fields=name,generic,comment,categories,filename,keywords

[colors]
background=11131af0
text=d8dae1ff
prompt=8aadf4ff
input=d8dae1ff
placeholder=4a5063ff
match=8aadf4ff
selection=2a2e3aff
selection-text=d8dae1ff
selection-match=a6da95ff
border=8aadf4cc

[border]
width=2
radius=12
