# Fuzzel — the only launcher. Quickshell-independent (SUPER+R).
[main]
font=JetBrainsMono Nerd Font:size=11
terminal=kitty -e
prompt="  "
layer=overlay
width=40
lines=12
horizontal-pad=20
vertical-pad=14
inner-pad=8
icons-enabled=yes
fields=name,generic,comment,categories,filename,keywords
# colours: generated by theme.sh
include=~/.local/state/kessel/theme/fuzzel.ini


[border]
width=2
radius=12
