# Kitty — the only terminal (also the Quickshell-independent fallback).
# Shared font sizes: mono 12 / UI 11 (see docs/THEME.md).

font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12.0

window_padding_width   8
hide_window_decorations yes
confirm_os_window_close 0
enable_audio_bell       no
cursor_shape            beam
cursor_trail            1
scrollback_lines        10000
copy_on_select          clipboard
shell_integration       enabled

# Kessel palette
background            #11131a
foreground            #d8dae1
selection_background  #2a2e3a
selection_foreground  #d8dae1
cursor                #8aadf4
url_color             #8aadf4
active_border_color   #8aadf4
inactive_border_color #2a2e3a
background_opacity    0.94

color0  #1b1e27
color8  #4a5063
color1  #e06c75
color9  #ec8a92
color2  #a6da95
color10 #bde8ae
color3  #eed49f
color11 #f5e3bd
color4  #8aadf4
color12 #a8c2f7
color5  #c6a0f6
color13 #d7bdf9
color6  #8bd5ca
color14 #a9e2da
color7  #b8bcc8
color15 #e6e8ee
