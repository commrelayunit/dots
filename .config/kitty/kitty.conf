# Kitty — the only terminal (also the Quickshell-independent fallback).
# Shared font sizes: mono 12 / UI 11 (see docs/THEME.md).

font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12.0

window_padding_width   8
hide_window_decorations yes
confirm_os_window_close 0
enable_audio_bell       no
cursor_shape            beam
cursor_trail            1
scrollback_lines        10000
copy_on_select          clipboard
shell_integration       enabled
# Interactive shell: fish (the login shell is untouched; SUPER+SHIFT+Return opens plain bash)
shell                   fish

# Colours: generated by ~/.config/hypr/scripts/theme.sh (dark = pitch black,
# light = eggshell, accents from the wallpaper). Reloaded live with SIGUSR1.
background_opacity 0.96
include ~/.local/state/kessel/theme/kitty.conf
