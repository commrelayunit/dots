# Starship — end-4-inspired layout (clean-room): context line, then a bare
# prompt character; fish shows the transient (collapsed) prompt for history.
"$schema" = "https://starship.rs/config-schema.json"
add_newline = true
command_timeout = 800

format = """$username$hostname$directory$git_branch$git_state$git_status$python$nodejs$rust$golang$cmd_duration$jobs
$character"""

[username]
style_user = "bold #c6a0f6"
style_root = "bold #e06c75"
format = "[$user]($style) "
show_always = false

[hostname]
ssh_only = true
ssh_symbol = "󰣀 "
style = "bold #8bd5ca"
format = "[$ssh_symbol$hostname]($style) "

[directory]
style = "bold #8aadf4"
read_only = " 󰌾"
truncation_length = 3
truncate_to_repo = true
format = "[ $path]($style)[$read_only]($read_only_style) "

[git_branch]
symbol = " "
style = "bold #a6da95"
format = "[$symbol$branch]($style) "

[git_status]
style = "#eed49f"
format = "([$all_status$ahead_behind]($style) )"

[cmd_duration]
min_time = 2000
style = "#4a5063"
format = "[ $duration]($style) "

[jobs]
symbol = " "
style = "#c6a0f6"

[character]
success_symbol = "[❯](bold #8aadf4)"
error_symbol = "[❯](bold #e06c75)"
vimcmd_symbol = "[❮](bold #a6da95)"

[python]
symbol = " "
format = "[$symbol$version( \\($virtualenv\\))]($style) "
[nodejs]
symbol = " "
format = "[$symbol$version]($style) "
[rust]
symbol = " "
format = "[$symbol$version]($style) "
[golang]
symbol = " "
format = "[$symbol$version]($style) "
