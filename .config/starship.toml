# SPDX-License-Identifier: GPL-3.0-or-later
# Starship — end-4/dots-hyprland *style* prompt, written from scratch:
# rounded "pills" on line 1 (duration · user•host · directory · git), a bare
# glyph on line 2, transient prompt in fish. Colours use the terminal palette
# (white/black/bright-*), so the prompt follows the wallpaper theme that the
# theme switcher writes into kitty.
"$schema" = "https://starship.rs/config-schema.json"
add_newline = false
command_timeout = 800

format = """
$cmd_duration$username$hostname $directory$git_branch$git_status$python$nodejs$rust$jobs
  $character"""

[character]
success_symbol = "[󰅂](bold bright-black)"
error_symbol = "[󰅂](bold red)"
vimcmd_symbol = "[󰅁](bold green)"

[cmd_duration]
min_time = 0
show_milliseconds = false
format = "[](fg:bright-black)[󰪢 $duration](bold fg:bright-white bg:bright-black)[](fg:bright-black) "

[username]
show_always = true
style_user = "bold fg:black bg:white"
style_root = "bold fg:black bg:red"
format = "[](fg:white)[$user]($style)"

[hostname]
ssh_only = false
ssh_symbol = " 󰌘"
format = "[•$hostname$ssh_symbol](bold fg:black bg:white)[](fg:white)"

[directory]
home_symbol = " "
read_only = " 󰌾"
truncation_length = 2
truncation_symbol = "…/"
style = "fg:black bg:bright-white"
format = "[](fg:bright-white)[󰉋 → $path]($style)[$read_only](fg:red bg:bright-white)[](fg:bright-white)"

[directory.substitutions]
"Desktop" = "󰇄 "
"Documents" = "󰈙 "
"Downloads" = "󰇚 "
"Music" = "󰎈 "
"Pictures" = "󰋩 "
"Videos" = "󰕧 "
"Projects" = "󰝰 "
"dot-files" = "󰒓 dot-files"

[git_branch]
symbol = "󰘬"
truncation_length = 16
truncation_symbol = "…"
format = " [](fg:green)[$symbol $branch](bold fg:black bg:green)[](fg:green)"

[git_status]
style = "bold yellow"
format = "( [$all_status$ahead_behind]($style))"

[python]
symbol = " "
format = " [$symbol$version( \\($virtualenv\\))](yellow)"
[nodejs]
symbol = " "
format = " [$symbol$version](green)"
[rust]
symbol = " "
format = " [$symbol$version](red)"
[jobs]
symbol = "󰻰 "
format = " [$symbol$number](purple)"
[package]
disabled = true
